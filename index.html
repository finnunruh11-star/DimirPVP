<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PVP Dimir — Mage Duel</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #070a0f;
        background-image:
          linear-gradient(135deg, transparent 0 48%, rgba(72, 184, 208, 0.06) 49% 51%, transparent 52%),
          linear-gradient(45deg, transparent 0 48%, rgba(217, 164, 65, 0.035) 49% 51%, transparent 52%);
        background-size: 96px 96px;
        overflow: hidden;
        overscroll-behavior: none;
        font-family: 'Bahnschrift SemiCondensed', 'Trebuchet MS', sans-serif;
      }
      #game {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        isolation: isolate;
        box-sizing: border-box;
      }
      canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
        image-rendering: pixelated;
        touch-action: none;
        user-select: none;
        outline: none;
        box-shadow: 0 18px 70px rgba(0, 0, 0, 0.48);
      }
      canvas:focus-visible {
        outline: 2px solid #d9a441;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
