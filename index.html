<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PVP Dimir — Mage Duel</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #080907;
        background-image:
          repeating-linear-gradient(0deg, transparent 0 12px, rgba(101, 71, 43, 0.16) 12px 13px),
          repeating-linear-gradient(90deg, transparent 0 86px, rgba(103, 87, 53, 0.08) 86px 87px);
        overflow: hidden;
        overscroll-behavior: none;
        font-family: 'Bahnschrift SemiCondensed', 'Trebuchet MS', sans-serif;
      }
      #game {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        isolation: isolate;
        box-sizing: border-box;
      }
      canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
        image-rendering: pixelated;
        touch-action: none;
        user-select: none;
        outline: none;
        box-shadow: 0 18px 54px rgba(0, 0, 0, 0.62);
      }
      canvas:focus-visible {
        outline: 2px solid #d2bd7f;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
